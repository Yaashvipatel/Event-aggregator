<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container wide">
        <h2>Sign Up</h2>
        <form id="signupForm">
            <input type="text" id="signupName" placeholder="Full Name" required>
            <input type="text" id="signupStudentId" placeholder="Student ID" required autocomplete="username">
            <div class="password-box">
                <input type="password" id="signupPassword" placeholder="Password (min 6 characters)" required minlength="6" autocomplete="new-password">
                <span class="toggle-password">Show</span>
            </div>
            <p class="hint">Pick your interests - we use them to recommend events:</p>
            <div id="interestChips" class="chips"></div>
            <button type="submit">Register</button>
            <p id="signupMessage" class="message"></p>
            <p>Already have an account? <a href="index.html">Login</a></p>
        </form>
    </div>
    <script src="js/common.js"></script>
    <script src="script.js"></script>
</body>
</html>
